[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-speech-pipeline"
version = "1.0.0"
description = "Unified Speech & Audio Intelligence Pipeline with Environmental Noise Invariance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Swastik Tripathi" }
]
dependencies = [
    "numpy>=1.21.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "torch>=1.13.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "streamlit>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
filterwarnings = [
    "ignore:.*The shape inference of prim..Constant type is missing.*:UserWarning",
    "ignore:.*Constant folding - Only steps=1 can be constant folded.*:UserWarning",
]
