name: CI Pipeline & Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system audio dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsndfile1 ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install torchvision onnx onnxruntime onnxscript
        python -m pip install -e .

    - name: Run Environment Preflight Validation
      run: |
        python -m pipeline.validate_environment

    - name: Fetch Pretrained Checkpoints (if configured)
      if: env.CHECKPOINT_URL != ''
      env:
        CHECKPOINT_URL: ${{ secrets.CHECKPOINT_URL }}
      run: |
        mkdir -p pipeline_output/checkpoints
        curl -sSL "$CHECKPOINT_URL" -o /tmp/checkpoints.tar.gz
        tar -xzf /tmp/checkpoints.tar.gz -C pipeline_output/checkpoints

    - name: Export Edge ONNX Models (Linux only, verbose)
      if: runner.os == 'Linux'
      env:
        ALLOW_UNTRAINED_ONNX: "1"
      run: |
        python -c "import sys; print('Python version:', sys.version)"
        python -X faulthandler -m pipeline.export_onnx

    - name: Run Synthetic Unit Tests (CPU Mode)
      env:
        PYTHONPATH: ${{ github.workspace }}
        ALLOW_UNTRAINED_ONNX: "1"
      run: |
        python -m pytest tests/ -v


